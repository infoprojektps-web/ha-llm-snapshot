name: "HA LLM Snapshot Exporter"
version: "0.2.0"
slug: "ha_llm_snapshot"
description: >-
  Creates a portable, privacy-filtered Home Assistant snapshot for analysis
  by an external LLM.
url: "https://github.com/infoprojektps-web/ha-llm-snapshot"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:archive-arrow-down
panel_title: LLM Snapshot
panel_admin: true
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
    path: /homeassistant_config
  - type: share
    read_only: false
options:
  include_states: true
  include_services: true
  include_packages: true
  include_dashboards: true
  include_diagnostics: true
  redact_locations: false
  keep_snapshots: 3
schema:
  include_states: bool
  include_services: bool
  include_packages: bool
  include_dashboards: bool
  include_diagnostics: bool
  redact_locations: bool
  keep_snapshots: "int(1,20)"
backup: hot
